spec_version: "1.0"
id: 03-architectural-idealism-guard
skill: yea.technology.high-level-architecture
fixture: context/fixtures/northwind-corp
description: >
  The characteristic failure of architecture documents: a clean target that quietly
  assumes somebody else fixes the thing in the middle. One option here is only coherent
  if a critical legacy system is retired, and that retirement is not in scope, not funded,
  and not decided. The run must state that as a dependency and a risk rather than
  designing as though it were settled — and must not expand its own scope to cover it.
  The two credible options also land inside the indifference band.

given:
  scenario: >
    Northwind's chain customers want to send orders by machine-to-machine interface rather
    than through the portal. Order intake currently runs entirely through nw-001, an
    in-house system built in 2009 with a technical fitness of 2, on which everything else
    depends and of whose four original engineers two have left. Everyone in the room agrees
    nw-001 should eventually be replaced. Nobody has funded it, and it is not in scope.

  ask:
    architecture_scope: multi_system_solution
    dominant_quality_attribute: throughput_and_scale
    estate_position: extends_existing
    delivery_and_run_model: internal_team
    change_expectation: steadily

  gather:
    provided:
      solution_intent: >
        Accept orders from chain customers through a machine-to-machine interface, at the
        volumes those accounts generate, without adding load to the phone-based process.
      must_have_requirements:
        - Accept structured orders from external customer systems
        - Validate against customer-specific price lists before acknowledgement
        - Acknowledge acceptance or rejection to the sending system within the agreed window
        - Reject cleanly and legibly on credit failure
        - Reconcile against the customer master for account and hierarchy
        - Give operations visibility of what arrived, what was accepted, and what failed
        - Handle resubmission of a corrected order without creating a duplicate
      existing_estate_touchpoints:
        - "nw-001 Order Capture System — validation and fulfilment, technical fitness 2, critical"
        - "nw-015 Customer Master — trade accounts and credit terms, technical fitness 1"
        - "nw-003 Pricing Engine — customer price lists, technical fitness 4"
        - "nw-019 Integration Middleware — the broker, in extended support until 2026-09-30"
      nonfunctional_requirements:
        - "Acknowledge an accepted order to the sending system within 60 seconds"
        - "Availability 99.5% during business hours; overnight arrivals may queue"
        - "No order may be lost or silently duplicated on retry"
        - "Recovery point zero for accepted orders; recovery time 2 hours"
      data_entities_and_classification:
        - "Order and pricing data — confidential"
        - "Trade account identifiers — confidential"
      integration_landscape: "context.integrations — int-03 and int-08 show pricing and customer master are reached from nw-001 directly, not through the broker"
      standards_catalogue: "context.standards"
      target_audience: governance_review
      candidate_options:
        - id: opt-1
          name: "Extend nw-001 directly with a machine-to-machine intake channel"
        - id: opt-2
          name: "New intake service in front of nw-001, brokered, with nw-001 unchanged as the system of record"
        - id: opt-3
          name: "New intake service writing to a new order store, bypassing nw-001, with nw-001 retired afterwards"
        - id: opt-4
          name: "Buy an order intake product and integrate it to nw-001"
    withheld:
      - expected_load_and_volumes
    available_context:
      - context.application_inventory
      - context.integrations
      - context.standards
      - context.policies

  policies_supplied:
    - id: integration_via_broker
      statement: "New integrations must go through the message broker rather than direct database connections between applications"
      kind: preference
    - id: customer_master_authority
      statement: "The customer master is the only authoritative source of trade account data; no application may maintain its own trade account records"
      kind: hard_constraint

expect:
  frame_restated_before_analysis: true

  idealism_guard:
    option: opt-3
    must_be_treated_as: "an option carrying an out-of-scope dependency"
    must_not_be_treated_as: "an option whose precondition can be assumed"
    dependency_must_appear_in:
      - architecture_overview risks_and_mitigations
      - decision_log
    scope_must_not_expand_to_cover: "retiring or replacing nw-001"

  top_two_within_indifference_band: true
  single_winner_declared: false
  tie_breakers_applied_in_order: true
  first_tie_breaker_expected: estate_coherence

  confidence: medium
  confidence_reason_must_reference: >
    load figures were proxied while the non-functional targets were supplied

  must_emit:
    - assumptions_register
    - confidence_rating
    - sensitivity_analysis
    - data_quality_note

  must_state:
    - That opt-3 is only coherent if nw-001 is retired, that this is neither funded nor
      decided, and that it is therefore a dependency on another programme rather than an
      assumption this architecture may make.
    - That retiring nw-001 is outside this architecture's scope, in the "deliberately not
      decided here" section.
    - That the two leading options are too close to separate on this evidence, in those
      terms, and the one piece of evidence that would separate them.
    - That the dominant quality attribute is throughput and scale while the volume figures
      are proxied, so the input the architecture most depends on is the one least evidenced.
    - That nw-015 has a technical fitness of 1 and no named owner, and what that means for
      any option that increases traffic to it.
    - That the broker is in extended support until 2026-09-30, and what that does to
      options routing new traffic through it.
    - That existing access to pricing and the customer master is direct rather than
      brokered, so the broker preference applies to new interfaces and is not retrospective.

  assumptions_register_must_contain:
    - load figures were proxied from the systems in the same capability rather than forecast

  must_not:
    - Recommend opt-3 on the basis that nw-001 will be retired.
    - Design a target architecture that requires nw-001 to be replaced without saying so.
    - Expand the scope to include the nw-001 replacement, however obviously needed it is.
    - Declare a single winner when the top two are inside the band.
    - Treat the broker's extended-support position as a settled fact rather than a risk.
    - Rate confidence high, given the volumes are proxied.

fails_if:
  - The recommended architecture depends on a system being replaced and the document does
    not say so on the views and in the risk table. This is the failure the case exists for
    and it is invisible in a diagram, because a fragile shared component looks exactly like
    a healthy one.
  - The run solves the bigger, more interesting problem it was not asked to solve.
  - A ranked list with a winner appears with no mention of the indifference band.

tolerance: >
  Which of opt-1 and opt-2 leads may vary; they are the expected pair inside the band.
  opt-4 may legitimately rank anywhere. What is not negotiable is the treatment of opt-3's
  dependency, the scope discipline, and the medium confidence rating.

notes: >
  The pull here is real and worth naming: replacing nw-001 IS the right long-term answer,
  and an architect who says so is not wrong. They are answering a question nobody asked,
  with somebody else's budget, in a document that was supposed to unblock a customer
  request. Saying it in the risk table is useful; designing around it is not.
